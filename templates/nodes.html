{% extends "base.html" %}
{% block title %}Nodes — Ðarlingtøn🦅{% endblock %}
{% block nav_nodes %}active{% endblock %}

{% block content %}
<div class="page-title">Nodes</div>
<div class="page-subtitle">Status of the Horizon node powering this explorer</div>

<div class="panel">
  <div class="panel-header">Node Status</div>
  <div class="detail-grid" id="node-detail">
    <div class="loading-state">Loading…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadNode() {
  const box = document.getElementById("node-detail");
  try {
    const data = await apiGet("/api/node-status");
    const s = data.status;
    box.innerHTML = `
      <div class="detail-row"><span class="detail-label">Horizon Version</span><span class="detail-value">${s.horizon_version || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Core Version</span><span class="detail-value">${s.core_version || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Network Passphrase</span><span class="detail-value">${s.network_passphrase || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Current Ledger</span><span class="detail-value">#${s.history_latest_ledger || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Core Ledger</span><span class="detail-value">#${s.core_latest_ledger || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Sync Status</span><span class="detail-value">${s.core_latest_ledger === s.history_latest_ledger ? '<span class="badge badge-success">Synced</span>' : '<span class="badge badge-failed">Syncing</span>'}</span></div>
      <div class="detail-row"><span class="detail-label">Operator</span><span class="detail-value mono-trunc">Ðarlingtøn🦅 (private node)</span></div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="error-state">${e.message}</div>`;
  }
}
loadNode();
setInterval(loadNode, 15000);
</script>
{% endblock %}
