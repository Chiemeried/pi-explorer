{% extends "base.html" %}
{% block title %}Transaction {{ tx_hash[:10] }}… — Ðarlingtøn🦅{% endblock %}
{% block nav_transactions %}active{% endblock %}

{% block content %}
<div class="page-title">Transaction</div>
<div class="page-subtitle mono-trunc" style="word-break:break-all;">{{ tx_hash }}</div>

<div class="panel">
  <div class="panel-header">Details</div>
  <div class="detail-grid" id="tx-detail">
    <div class="loading-state">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">Operations</div>
  <div class="table-scroll"><table>
    <thead><tr><th>Type</th><th>Details</th></tr></thead>
    <tbody id="op-body"><tr><td colspan="2" class="loading-state">Loading…</td></tr></tbody>
  </table></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDetail() {
  const detailBox = document.getElementById("tx-detail");
  const opBody = document.getElementById("op-body");
  try {
    const data = await apiGet(`/api/transactions/${encodeURIComponent("{{ tx_hash }}")}`);
    const t = data.transaction;
    const statusBadge = t.successful
      ? '<span class="badge badge-success">Success</span>'
      : '<span class="badge badge-failed">Failed</span>';
    detailBox.innerHTML = `
      <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${statusBadge}</span></div>
      <div class="detail-row"><span class="detail-label">Ledger</span><span class="detail-value"><a href="/blocks/${t.ledger}" class="accent">#${t.ledger}</a></span></div>
      <div class="detail-row"><span class="detail-label">Source Account</span><span class="detail-value mono-trunc"><a href="/account/${t.source_account}" class="accent">${t.source_account}</a></span></div>
      <div class="detail-row"><span class="detail-label">Fee Charged</span><span class="detail-value">${formatPi(t.fee_charged, true)}</span></div>
      <div class="detail-row"><span class="detail-label">Operation Count</span><span class="detail-value">${t.operation_count}</span></div>
      <div class="detail-row"><span class="detail-label">Created</span><span class="detail-value">${new Date(t.created_at).toLocaleString()}</span></div>
      <div class="detail-row"><span class="detail-label">Memo</span><span class="detail-value">${t.memo || "—"}</span></div>
    `;

    const ops = data.operations;
    if (!ops.length) {
      opBody.innerHTML = '<tr><td colspan="2" class="empty-state">No operations</td></tr>';
      return;
    }
    opBody.innerHTML = "";
    for (const o of ops) {
      const tr = el("tr");
      let details = "";
      if (o.type === "payment") {
        details = `${truncateMiddle(o.from)} → ${truncateMiddle(o.to)} · ${formatPi(o.amount)}`;
      } else if (o.type === "create_account") {
        details = `Funder: ${truncateMiddle(o.funder)} → ${truncateMiddle(o.account)} · ${formatPi(o.starting_balance)}`;
      } else {
        details = o.source_account ? truncateMiddle(o.source_account) : "—";
      }
      tr.innerHTML = `<td><span class="badge badge-op">${o.type}</span></td><td class="mono-trunc">${details}</td>`;
      opBody.appendChild(tr);
    }
  } catch (e) {
    detailBox.innerHTML = `<div class="error-state">${e.message}</div>`;
    opBody.innerHTML = "";
  }
}
loadDetail();
</script>
{% endblock %}
